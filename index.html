<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANTE ALIGHIERI — Sito Ufficiale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030508;
            --bg-card: #080d14;
            --accent-blue: #1e90ff;
            --silver-metal: #b8c5d6;
            --gold-antique: #c5a880;
            --text-light: #e1e8f0;
            --text-muted: #7a8a9e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.6;
        }

        h1, h2, .gothic-font {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(3, 5, 8, 0.95);
            border-bottom: 1px solid rgba(30, 144, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--silver-metal);
            text-decoration: none;
            text-shadow: 0 0 10px rgba(30, 144, 255, 0.3);
        }

        .hero {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle at center, #0a192f 0%, #030508 75%);
        }

        .badge {
            background: var(--accent-blue);
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(30, 144, 255, 0.5);
        }

        .cover-box {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 25px;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid var(--accent-blue);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(30, 144, 255, 0.2);
            background-color: #080d14;
        }

        .lock-overlay {
            position: absolute;
            inset: 0;
            background: rgba(3, 5, 8, 0.82);
            backdrop-filter: blur(6px);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }

        .lock-overlay.unlocked {
            opacity: 0;
            pointer-events: none;
        }

        .lock-icon { font-size: 3rem; margin-bottom: 8px; filter: drop-shadow(0 0 10px rgba(30,144,255,0.5)); }
        .lock-label {
            font-family: 'Cinzel', serif;
            color: var(--silver-metal);
            font-weight: 700;
            letter-spacing: 4px;
            font-size: 0.9rem;
        }

        .hero h1 {
            font-size: clamp(2.8rem, 7vw, 5.5rem);
            color: var(--text-light);
            line-height: 1.1;
            text-shadow: 0 0 30px rgba(30, 144, 255, 0.3);
        }

        .hero h2 {
            font-size: clamp(1rem, 2.2vw, 1.5rem);
            color: var(--silver-metal);
            margin-top: 8px;
        }

        .release-info {
            color: var(--text-muted);
            margin: 12px 0 30px;
            font-size: 1.05rem;
        }

        .countdown {
            display: flex;
            gap: 16px;
            margin-bottom: 35px;
        }

        .time-box {
            background: var(--bg-card);
            border: 1px solid rgba(30, 144, 255, 0.3);
            padding: 15px 18px;
            border-radius: 8px;
            min-width: 82px;
            box-shadow: inset 0 0 10px rgba(30, 144, 255, 0.05);
        }

        .time-box span {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-shadow: 0 0 10px rgba(30, 144, 255, 0.5);
        }

        .time-box small {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .btn {
            display: inline-block;
            padding: 16px 36px;
            background: var(--accent-blue);
            color: #ffffff;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            letter-spacing: 2px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.4);
            transition: all 0.2s;
        }

        .btn:hover {
            background: #3a9eff;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(30, 144, 255, 0.7);
        }

        .hidden { display: none !important; }

        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(30, 144, 255, 0.15);
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo gothic-font">DANTE ALIGHIERI</a>
    </nav>

    <header class="hero">
        <div class="badge" id="badge-status">Fuori il 27 Novembre alle 00:00</div>

        <div class="cover-box">
            <img src="immagini/primo-canto.png" alt="Primo Canto" class="cover-img">
            <div class="lock-overlay" id="lock-overlay">
                <span class="lock-icon">🔒</span>
                <span class="lock-label">LOCKED</span>
            </div>
        </div>

        <h1>PRIMO CANTO</h1>
        <h2>DANTE ALIGHIERI</h2>
        <p class="release-info" id="release-text">Il primo singolo ufficiale. Disponibile allo scoccare della mezzanotte del 27 Novembre.</p>

        <div id="countdown-area">
            <div class="countdown" id="countdown">
                <div class="time-box"><span id="days">00</span><small>Giorni</small></div>
                <div class="time-box"><span id="hours">00</span><small>Ore</small></div>
                <div class="time-box"><span id="minutes">00</span><small>Minuti</small></div>
                <div class="time-box"><span id="seconds">00</span><small>Secondi</small></div>
            </div>
        </div>

        <a href="canzoni/primo_canto.html" class="btn hidden" id="enter-btn">Entra nel Singolo ▶</a>
    </header>

    <footer>
        <p>© 2026 Dante Alighieri — Discografia Ufficiale</p>
    </footer>

    <script>
        const targetDate = new Date("2026-11-27T00:00:00").getTime();

        function aggiornaTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                sbloccaHome();
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }

        function sbloccaHome() {
            document.getElementById("lock-overlay").classList.add("unlocked");
            document.getElementById("badge-status").innerText = "Fuori Ora • Disponibile";
            document.getElementById("release-text").innerText = "Il singolo è ufficialmente uscito!";
            document.getElementById("countdown-area").classList.add("hidden");
            document.getElementById("enter-btn").classList.remove("hidden");
        }

        setInterval(aggiornaTimer, 1000);
        aggiornaTimer();
    </script>
</body>
</html>
